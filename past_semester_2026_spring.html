  .card-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:3px}

  .card-grp{display:inline-block;background:var(--accent-light);color:var(--accent);font-weight:700;font-size:12px;padding:1px 7px;border-radius:5px;margin-right:6px}

  .card-topic{font-size:13px;color:var(--ink);margin-top:4px;padding-top:4px;border-top:1px dashed var(--border-light)}
  .empty{color:var(--ink-3);font-size:13px;padding:14px 4px}
  .footer{text-align:center;font-size:11.5px;color:var(--ink-3);margin-top:26px}

ультет", "weekday": "Пятница", "t1": "08:00", "t2": "10:10", "grp": "7106", "tch": "Печурский А.И.", "rm": "128"}, {"fac": "Стом. МФИУ (рус)", "weekday": "Пятница", "t1": "10:30", "t2": "12:45", "grp": "6146", "tch": "Гаптарь М.И.", "rm": "128"}, {"fac": "Стом. МФИУ (рус)", "weekday": "Пятница", "t1": "13:00", "t2": "15:15", "grp": "6154", "tch": "Данченко А.Д.", "rm": "129"}, {"fac": "Стоматологический факультет", "weekday": "Пятница", "t1": "13:05", "t2": "15:20", "grp": "7114", "tch": "Данченко А.Д.", "rm": "129"}, {"fac": "Стом. МФИУ (рус)", "weekday": "Пятница", "t1": "15:30", "t2": "17:45", "grp": "6142", "tch": "Корниенко Е.М.О.", "rm": "102"}];
const FACULTIES = ["МПФ", "Стоматологический факультет", "Стом. МФИУ (рус)"];
const DAYS = ['Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'];
const DAYS_SHORT = ['Пн','Вт','Ср','Чт','Пт','Сб'];

let activeFac = null;
let activeSection = 'lectures'; // 'lectures' | 'classes'
let activeDay = null;

function facCount(fac){
  return LECTURES.filter(r=>r.fac===fac).length + CLASSES.filter(r=>r.fac===fac).length;
}

function renderFacTabs(){
  const t = document.getElementById('facTabs');
  t.innerHTML = '';
  FACULTIES.forEach(fac=>{
    const cnt = facCount(fac);
    if(cnt===0) return;
    const btn = document.createElement('button');
    btn.className = 'tab' + (fac===activeFac?' active':'');
    btn.innerHTML = fac + ' <span class="tab-cnt">'+cnt+'</span>';
    btn.onclick = ()=>{ activeFac = fac; activeSection = 'lectures'; activeDay = null; renderFacTabs(); renderContent(); };
    t.appendChild(btn);
  });
}

function renderLectures(c){
  const lecs = LECTURES.filter(r=>r.fac===activeFac).sort((a,b)=> a.date.localeCompare(b.date) || a.t1.localeCompare(b.t1));
  if(lecs.length===0){
    const e = document.createElement('div'); e.className='empty'; e.textContent='Лекций не найдено.'; c.appendChild(e);
    return;
  }
  lecs.forEach(r=>{
    const card = document.createElement('div'); card.className = 'card';
    const [y,m,dd] = (r.date||'').split('-');
    const dateStr = (y && m && dd) ? (dd+'.'+m+'.'+y) : r.date;
    card.innerHTML =
      '<div class="card-top"><span class="card-date">'+dateStr+' ('+ (r.weekday||'') +')</span>'+
      '<span class="card-time">'+r.t1+'–'+r.t2+'</span></div>'+
      '<div class="card-line">'+ (r.grp? '<span class="card-grp">'+r.grp+'</span>' : '') + (r.tch||'') + (r.rm? ' · ауд. '+r.rm : '') + '</div>'+
      (r.topic? '<div class="card-topic">'+r.topic+'</div>' : '');
    c.appendChild(card);
  });
}

function renderClasses(c){
  const clsAll = CLASSES.filter(r=>r.fac===activeFac);
  if(clsAll.length===0){
    const e = document.createElement('div'); e.className='empty'; e.textContent='Занятий не найдено.'; c.appendChild(e);
    return;
  }
  if(!activeDay || !DAYS.includes(activeDay)){
    activeDay = DAYS.find(d=>clsAll.some(r=>r.weekday===d)) || DAYS[0];
  }
  const subtabs = document.createElement('div'); subtabs.className = 'subtabs';
  DAYS.forEach((day,i)=>{
    const cnt = clsAll.filter(r=>r.weekday===day).length;
    if(cnt===0) return;
    const b = document.createElement('button');
    b.className = 'subtab' + (day===activeDay?' active':'');
    b.textContent = DAYS_SHORT[i] + ' (' + cnt + ')';
    b.onclick = ()=>{ activeDay = day; renderContent(); };
    subtabs.appendChild(b);
  });
  c.appendChild(subtabs);

  const dayRows = clsAll.filter(r=>r.weekday===activeDay).sort((a,b)=>a.t1.localeCompare(b.t1));
  dayRows.forEach(r=>{
    const card = document.createElement('div'); card.className = 'card';
    card.innerHTML =
      '<div class="card-top"><span class="card-time">'+r.t1+'–'+r.t2+'</span></div>'+
      '<div class="card-line">'+ (r.grp? '<span class="card-grp">'+r.grp+'</span>' : '') + (r.tch||'') + (r.rm? ' · ауд. '+r.rm : '') + '</div>';
    c.appendChild(card);
  });
}

function renderContent(){
  const c = document.getElementById('content');
  c.innerHTML = '';
  if(!activeFac){ c.innerHTML = '<div class="empty">Выберите факультет.</div>'; return; }

  const lecCount = LECTURES.filter(r=>r.fac===activeFac).length;
  const clsCount = CLASSES.filter(r=>r.fac===activeFac).length;

  const sec = document.createElement('div'); sec.className = 'sectiontabs';
  const b1 = document.createElement('button');
  b1.className = 'sectiontab' + (activeSection==='lectures'?' active':'');
  b1.innerHTML = '🎓 Лекции<span class="sec-cnt">'+lecCount+'</span>';
  b1.onclick = ()=>{ activeSection = 'lectures'; renderContent(); };
  const b2 = document.createElement('button');
  b2.className = 'sectiontab' + (activeSection==='classes'?' active':'');
  b2.innerHTML = '📋 Занятия<span class="sec-cnt">'+clsCount+'</span>';
  b2.onclick = ()=>{ activeSection = 'classes'; activeDay = null; renderContent(); };
  sec.appendChild(b1); sec.appendChild(b2);
  c.appendChild(sec);

  if(activeSection === 'lectures'){
    renderLectures(c);
  } else {
    renderClasses(c);
  }
}

activeFac = FACULTIES.find(f=>facCount(f)>0);
renderFacTabs();
renderContent();
</script>
